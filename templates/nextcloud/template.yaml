name: Nextcloud
slug: nextcloud
version: 1.0.0
description: Files, calendar, contacts and office in one self-hosted cloud — a Google Drive alternative.
category: storage
icon: nextcloud
docs: https://github.com/nextcloud/docker
stateful: true
min_memory_mb: 1024
popular: true
tags: [files, sync, calendar, office]
public:
  - service: nextcloud
    port: 80
inputs:
  - key: NEXTCLOUD_ADMIN_USER
    type: string
    label: Admin username
    default: admin
  - key: NEXTCLOUD_ADMIN_PASSWORD
    type: secret
    generate: password(24)
    label: Admin password
  - key: DB_PASSWORD
    type: secret
    generate: password(32)
    label: Database password
  - key: DB_ROOT_PASSWORD
    type: secret
    generate: password(32)
    label: Database root password
