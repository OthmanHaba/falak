name: ntfy
slug: ntfy
version: 1.0.0
description: Push notifications to your phone or desktop from any script with a simple HTTP PUT/POST.
category: communication
icon: ntfy
docs: https://docs.ntfy.sh
stateful: true
min_memory_mb: 128
tags: [push notifications, alerts, pub-sub]
public:
  - service: ntfy
    port: 80
inputs:
  - key: DEFAULT_ACCESS
    type: select
    label: Default topic access
    description: read-write lets anyone publish and subscribe. Pick deny-all and add users with `ntfy user add` (server terminal) to lock it down.
    options: [read-write, read-only, write-only, deny-all]
    default: read-write
