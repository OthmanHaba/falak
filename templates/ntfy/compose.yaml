services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    command: ["serve"]
    expose: ["80"]
    environment:
      NTFY_BASE_URL: ${{ kiln.url(ntfy) }}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: ${DEFAULT_ACCESS}
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/v1/health | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ntfy-data:
