name: Langflow
slug: langflow
version: 1.0.0
description: Visual builder for AI agents and RAG pipelines, served as APIs.
category: ai
icon: langflow
docs: https://docs.langflow.org
stateful: true
min_memory_mb: 2048
tags: [llm, agents, rag, low-code]
public:
  - service: langflow
    port: 7860
inputs:
  - key: LANGFLOW_SUPERUSER
    type: string
    label: Admin username
    default: admin
  - key: LANGFLOW_SUPERUSER_PASSWORD
    type: secret
    generate: password(24)
    label: Admin password
  - key: LANGFLOW_SECRET_KEY
    type: secret
    generate: secret(48)
    label: Secret key
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
