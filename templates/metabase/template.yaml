name: Metabase
slug: metabase
version: 1.0.0
description: Business intelligence and dashboards anyone on your team can use, with PostgreSQL as its app database.
category: analytics
icon: metabase
docs: https://www.metabase.com/docs/latest/installation-and-operation/running-metabase-on-docker
stateful: true
min_memory_mb: 2048
tags: [bi, dashboards, sql]
public:
  - service: metabase
    port: 3000
inputs:
  - key: MB_ENCRYPTION_SECRET_KEY
    type: secret
    generate: secret(32)
    label: Encryption key
    description: Encrypts database connection details stored by Metabase.
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
  - key: TIMEZONE
    type: select
    label: Timezone
    options: [UTC, Europe/London, Europe/Berlin, Europe/Paris, America/New_York, America/Chicago, America/Los_Angeles, Asia/Tokyo, Asia/Singapore, Australia/Sydney]
    default: UTC
