# Open the site right after the first deploy: the setup wizard creates the admin account.
services:
  metabase:
    image: metabase/metabase:v0.63.18.2
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_SITE_URL: ${{ falak.url(metabase) }}
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: ${TIMEZONE}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - metabase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  metabase-db:
