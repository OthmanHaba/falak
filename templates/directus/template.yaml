name: Directus
slug: directus
version: 1.0.0
description: Instant REST + GraphQL API and no-code data studio on top of PostgreSQL.
category: cms
icon: directus
docs: https://directus.io/docs/self-hosting/overview
stateful: true
min_memory_mb: 1024
tags: [headless cms, api, graphql]
public:
  - service: directus
    port: 8055
inputs:
  - key: ADMIN_EMAIL
    type: email
    label: Admin email
  - key: ADMIN_PASSWORD
    type: secret
    generate: password(24)
    label: Admin password
  - key: SECRET
    type: secret
    generate: secret(64)
    label: Secret
    description: Signs access tokens.
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
