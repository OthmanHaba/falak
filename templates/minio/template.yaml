name: MinIO
slug: minio
version: 1.0.0
description: S3-compatible object storage with its web console (community build — upstream stopped publishing images).
category: storage
icon: minio
docs: https://github.com/pgsty/minio
stateful: true
min_memory_mb: 512
popular: true
tags: [s3, object storage, backups]
public:
  - service: minio
    port: 9000
  - service: console
    port: 8080
inputs:
  - key: MINIO_ROOT_USER
    type: string
    label: Root user
    default: admin
  - key: MINIO_ROOT_PASSWORD
    type: secret
    generate: password(32)
    label: Root password
