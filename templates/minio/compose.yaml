# pgsty/minio is a maintained community build of MinIO (the upstream project no longer publishes images).
# Two public URLs: the S3 API (minio) and the web console (console, a proxy to MinIO's console port).
services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    expose: ["9000", "9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${{ kiln.url(minio) }}
      MINIO_BROWSER_REDIRECT_URL: ${{ kiln.url(console) }}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  console:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from :8080 --to minio:9001
    expose: ["8080"]
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      # `caddy reverse-proxy` runs without the admin API: probe the proxied console itself.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio-data:
