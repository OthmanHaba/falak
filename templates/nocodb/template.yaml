name: NocoDB
slug: nocodb
version: 1.0.0
description: Open-source Airtable alternative — spreadsheets, forms and APIs on top of your data.
category: databases
icon: ./icon.svg
docs: https://nocodb.com/docs/self-hosting/installation/docker
stateful: true
min_memory_mb: 512
tags: [spreadsheet, no-code, airtable]
public:
  - service: nocodb
    port: 8080
inputs:
  - key: NC_AUTH_JWT_SECRET
    type: secret
    generate: secret(48)
    label: JWT secret
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
