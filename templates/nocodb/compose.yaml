# Open the site right after the first deploy: the first account created becomes the super admin.
services:
  nocodb:
    image: nocodb/nocodb:2026.09.0
    restart: unless-stopped
    expose: ["8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NC_DB: pg://db:5432?u=nocodb&p=${POSTGRES_PASSWORD}&d=nocodb
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: ${{ kiln.url(nocodb) }}
      NC_DISABLE_TELE: "true"
    volumes:
      - nocodb-data:/usr/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nocodb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  nocodb-data:
  nocodb-db:
