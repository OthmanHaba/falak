name: Meilisearch
slug: meilisearch
version: 1.0.0
description: Lightning-fast, typo-tolerant search engine with a REST API and hybrid (AI) search.
category: databases
icon: meilisearch
docs: https://www.meilisearch.com/docs/learn/self_hosted/configure_meilisearch_at_launch
stateful: true
min_memory_mb: 512
tags: [search, api]
public:
  - service: meilisearch
    port: 7700
inputs:
  - key: MEILI_MASTER_KEY
    type: secret
    generate: secret(32)
    label: Master key
    description: Required on every API request; derive search / admin API keys from it.
  - key: MEILI_NO_ANALYTICS
    type: boolean
    label: Disable anonymous telemetry
    default: true
