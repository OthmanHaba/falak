services:
  meilisearch:
    image: getmeili/meilisearch:v1.54.0
    restart: unless-stopped
    expose: ["7700"]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS}
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  meili-data:
