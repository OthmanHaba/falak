# Open the site right after the first deploy: the first visitor creates the admin account.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    restart: unless-stopped
    expose: ["3001"]
    environment:
      TZ: ${TIMEZONE}
      UPTIME_KUMA_PORT: "3001"
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  uptime-kuma-data:
