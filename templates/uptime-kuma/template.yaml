name: Uptime Kuma
slug: uptime-kuma
version: 1.0.0
description: Self-hosted uptime monitoring with status pages and 90+ notification channels.
category: monitoring
icon: uptimekuma
docs: https://github.com/louislam/uptime-kuma/wiki
stateful: true
min_memory_mb: 256
popular: true
tags: [uptime, status page, alerts]
public:
  - service: uptime-kuma
    port: 3001
inputs:
  - key: TIMEZONE
    type: select
    label: Timezone
    options: [UTC, Europe/London, Europe/Berlin, Europe/Paris, America/New_York, America/Chicago, America/Los_Angeles, Asia/Tokyo, Asia/Singapore, Australia/Sydney]
    default: UTC
