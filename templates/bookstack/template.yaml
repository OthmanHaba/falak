name: BookStack
slug: bookstack
version: 1.0.0
description: Simple wiki and documentation platform organised into shelves, books and pages.
category: cms
icon: bookstack
docs: https://www.bookstackapp.com/docs/
stateful: true
min_memory_mb: 512
tags: [wiki, documentation, knowledge base]
public:
  - service: bookstack
    port: 80
inputs:
  - key: APP_KEY
    type: secret
    generate: secret(32)
    label: Application key
  - key: DB_PASSWORD
    type: secret
    generate: password(32)
    label: Database password
  - key: DB_ROOT_PASSWORD
    type: secret
    generate: password(32)
    label: Database root password
