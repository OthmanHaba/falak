name: Grafana
slug: grafana
version: 1.0.0
description: Dashboards and alerting for metrics, logs and traces from any data source (OSS edition).
category: monitoring
icon: grafana
docs: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
stateful: true
min_memory_mb: 512
popular: true
tags: [dashboards, metrics, observability]
public:
  - service: grafana
    port: 3000
inputs:
  - key: GF_SECURITY_ADMIN_USER
    type: string
    label: Admin user
    default: admin
  - key: GF_SECURITY_ADMIN_PASSWORD
    type: secret
    generate: password(24)
    label: Admin password
  - key: GF_PLUGINS_PREINSTALL
    type: string
    label: Plugins to install
    description: Comma-separated plugin ids, e.g. grafana-clock-panel.
    required: false
