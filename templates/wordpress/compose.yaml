# Open the site right after the first deploy to run the installer (it creates the admin account).
services:
  wordpress:
    image: wordpress:7.1.2-php8.3-apache
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${{ kiln.url(wordpress) }}');
        define('WP_SITEURL', '${{ kiln.url(wordpress) }}');
        define('FORCE_SSL_ADMIN', true);
    volumes:
      - wordpress-html:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/wp-includes/images/blank.gif || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - wordpress-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  wordpress-html:
  wordpress-db:
