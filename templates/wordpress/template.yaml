name: WordPress
slug: wordpress
version: 1.0.0
description: The world's most popular CMS, on Apache with MariaDB.
category: cms
icon: wordpress
docs: https://github.com/docker-library/docs/tree/master/wordpress
stateful: true
min_memory_mb: 512
popular: true
tags: [blog, website, php]
public:
  - service: wordpress
    port: 80
inputs:
  - key: DB_PASSWORD
    type: secret
    generate: password(32)
    label: Database password
  - key: DB_ROOT_PASSWORD
    type: secret
    generate: password(32)
    label: Database root password
  - key: TABLE_PREFIX
    type: string
    label: Table prefix
    default: wp_
