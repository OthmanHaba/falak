name: Plausible Analytics
slug: plausible
version: 1.0.0
description: Privacy-friendly, cookie-free web analytics (Community Edition) with ClickHouse and PostgreSQL.
category: analytics
icon: plausibleanalytics
docs: https://github.com/plausible/community-edition/wiki
stateful: true
min_memory_mb: 2048
popular: true
tags: [web analytics, privacy]
public:
  - service: plausible
    port: 8000
inputs:
  - key: SECRET_KEY_BASE
    type: secret
    generate: secret(64)
    label: Secret key base
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
  - key: DISABLE_REGISTRATION
    type: select
    label: Registration
    description: The first account can always register; this controls everyone after it.
    options: ["true", invite_only, "false"]
    default: invite_only
