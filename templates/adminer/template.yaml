name: Adminer
slug: adminer
version: 1.0.0
description: Database manager in one page for PostgreSQL, MySQL, MariaDB, SQLite and more.
category: databases
icon: adminer
docs: https://www.adminer.org
stateful: false
min_memory_mb: 64
tags: [database, sql, admin]
public:
  - service: adminer
    port: 8080
inputs:
  - key: DEFAULT_SERVER
    type: string
    label: Default server
    description: Host shown on the login form, e.g. a database's private address.
    default: db
