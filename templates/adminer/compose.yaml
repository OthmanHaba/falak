# Adminer asks for database credentials on every login; it stores nothing.
services:
  adminer:
    image: adminer:6.1.1
    restart: unless-stopped
    expose: ["8080"]
    environment:
      ADMINER_DEFAULT_SERVER: ${DEFAULT_SERVER}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
