# Git over HTTPS only (SSH is disabled; the edge routes HTTP). The first registered user becomes the admin.
services:
  gitea:
    image: gitea/gitea:1.27.3
    restart: unless-stopped
    expose: ["3000"]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: ${{ falak.domain(gitea) }}
      GITEA__server__ROOT_URL: ${{ falak.url(gitea) }}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__service__DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  gitea-data:
