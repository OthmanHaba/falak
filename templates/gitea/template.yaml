name: Gitea
slug: gitea
version: 1.0.0
description: Lightweight self-hosted Git service with pull requests, issues, packages and Actions.
category: dev-tools
icon: gitea
docs: https://docs.gitea.com/installation/install-with-docker
stateful: true
min_memory_mb: 512
tags: [git, code review, ci]
public:
  - service: gitea
    port: 3000
inputs:
  - key: GITEA_SECRET_KEY
    type: secret
    generate: secret(64)
    label: Secret key
  - key: GITEA_INTERNAL_TOKEN
    type: secret
    generate: secret(105)
    label: Internal token
  - key: DISABLE_REGISTRATION
    type: boolean
    label: Disable registration
    description: Leave off until you have created your own account.
    default: false
