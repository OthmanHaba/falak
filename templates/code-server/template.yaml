name: code-server
slug: code-server
version: 1.0.0
description: VS Code in the browser, running on your server behind a password.
category: dev-tools
icon: coder
docs: https://coder.com/docs/code-server
stateful: true
min_memory_mb: 1024
tags: [ide, vscode, remote development]
public:
  - service: code-server
    port: 8080
inputs:
  - key: PASSWORD
    type: secret
    generate: password(24)
    label: Login password
