# The workspace is the container's /home/coder (a named volume); it cannot reach the server's own files.
services:
  code-server:
    image: codercom/code-server:4.139.1
    restart: unless-stopped
    expose: ["8080"]
    environment:
      PASSWORD: ${PASSWORD}
    volumes:
      - code-server-home:/home/coder
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  code-server-home:
