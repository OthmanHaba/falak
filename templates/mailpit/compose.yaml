# SMTP listens on mailpit:1025 inside this stack; from elsewhere use the HTTP send API (POST /api/v1/send).
services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    expose: ["8025", "1025"]
    environment:
      MP_UI_AUTH: admin:${MAILPIT_PASSWORD}
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAX_MESSAGES}
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mailpit-data:
