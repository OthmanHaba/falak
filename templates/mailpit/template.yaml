name: Mailpit
slug: mailpit
version: 1.0.0
description: Email testing — catches outgoing mail (SMTP + send API) and shows it in a web inbox.
category: dev-tools
icon: ./icon.svg
docs: https://mailpit.axllent.org/docs/
min_memory_mb: 128
tags: [email, smtp, testing]
public:
  - service: mailpit
    port: 8025
inputs:
  - key: MAILPIT_PASSWORD
    type: secret
    generate: password(24)
    label: Web UI password
    description: Basic auth for the inbox and API (user admin).
  - key: MAX_MESSAGES
    type: number
    label: Messages to keep
    default: 5000
