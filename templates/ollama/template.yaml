name: Ollama + Open WebUI
slug: ollama
version: 1.0.0
description: Run open LLMs (Llama, Qwen, Mistral…) on your server with a ChatGPT-style interface.
category: ai
icon: ollama
docs: https://docs.openwebui.com
stateful: true
min_memory_mb: 4096
popular: true
tags: [llm, chat, ai, local models]
public:
  - service: open-webui
    port: 8080
inputs:
  - key: WEBUI_SECRET_KEY
    type: secret
    generate: secret(48)
    label: Session secret
  - key: ENABLE_SIGNUP
    type: boolean
    label: Allow sign-ups
    description: The first account becomes the admin. Turn this off once your team has joined.
    default: true
