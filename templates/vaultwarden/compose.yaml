services:
  vaultwarden:
    image: vaultwarden/server:1.37.3
    restart: unless-stopped
    expose: ["80"]
    environment:
      DOMAIN: ${{ kiln.url(vaultwarden) }}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ROCKET_PORT: "80"
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  vaultwarden-data:
