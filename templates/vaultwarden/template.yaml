name: Vaultwarden
slug: vaultwarden
version: 1.0.0
description: Lightweight Bitwarden-compatible password manager server; works with all Bitwarden apps.
category: dev-tools
icon: vaultwarden
docs: https://github.com/dani-garcia/vaultwarden/wiki
stateful: true
min_memory_mb: 128
tags: [passwords, security, bitwarden]
public:
  - service: vaultwarden
    port: 80
inputs:
  - key: ADMIN_TOKEN
    type: secret
    generate: secret(48)
    label: Admin token
    description: Opens the /admin panel.
  - key: SIGNUPS_ALLOWED
    type: boolean
    label: Allow sign-ups
    description: Turn off (in the variables) once your accounts exist.
    default: true
