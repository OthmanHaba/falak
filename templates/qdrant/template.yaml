name: Qdrant
slug: qdrant
version: 1.0.0
description: Vector database for semantic search and RAG, with a web dashboard at /dashboard.
category: ai
icon: qdrant
docs: https://qdrant.tech/documentation/
stateful: true
min_memory_mb: 512
tags: [vector database, embeddings, rag, search]
public:
  - service: qdrant
    port: 6333
inputs:
  - key: QDRANT_API_KEY
    type: secret
    generate: secret(40)
    label: API key
    description: Send it as the api-key header; the dashboard asks for it once.
