# RedisInsight has no login of its own, so it is published only through a basic-auth proxy (insight).
# Redis itself (redis:6379) is reachable from the services of this stack.
services:
  redis:
    image: redis/redis-stack:7.4.0-v8
    restart: unless-stopped
    expose: ["6379", "8001"]
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD} --appendonly yes
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  insight:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    expose: ["8080"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      INSIGHT_PASSWORD: ${INSIGHT_PASSWORD}
    command:
      - sh
      - -c
      - |
        export INSIGHT_HASH="$$(caddy hash-password --plaintext "$$INSIGHT_PASSWORD")"
        printf ':8080 {\n\tbasic_auth {\n\t\tadmin {$$INSIGHT_HASH}\n\t}\n\treverse_proxy redis:8001\n}\n' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
