name: Redis Stack
slug: redis-stack
version: 1.0.0
description: Redis with JSON, search, time series and probabilistic structures, plus the RedisInsight GUI behind a password.
category: databases
icon: redis
docs: https://redis.io/docs/latest/operate/oss_and_stack/install/install-stack/docker/
stateful: true
min_memory_mb: 512
tags: [cache, key-value, search, json]
public:
  - service: insight
    port: 8080
inputs:
  - key: REDIS_PASSWORD
    type: secret
    generate: password(32)
    label: Redis password
  - key: INSIGHT_PASSWORD
    type: secret
    generate: password(24)
    label: RedisInsight password
    description: Basic auth in front of RedisInsight (user admin).
