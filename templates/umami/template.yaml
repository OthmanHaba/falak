name: Umami
slug: umami
version: 1.0.0
description: Simple, fast, privacy-focused web analytics — a Google Analytics alternative.
category: analytics
icon: umami
docs: https://umami.is/docs
stateful: true
min_memory_mb: 512
popular: true
tags: [web analytics, privacy]
public:
  - service: umami
    port: 3000
inputs:
  - key: APP_SECRET
    type: secret
    generate: secret(64)
    label: App secret
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
