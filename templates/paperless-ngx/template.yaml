name: Paperless-ngx
slug: paperless-ngx
version: 1.0.0
description: Scan, OCR and index your paper documents into a searchable archive.
category: storage
icon: paperlessngx
docs: https://docs.paperless-ngx.com
stateful: true
min_memory_mb: 1024
tags: [documents, ocr, archive]
public:
  - service: paperless
    port: 8000
inputs:
  - key: PAPERLESS_ADMIN_USER
    type: string
    label: Admin username
    default: admin
  - key: PAPERLESS_ADMIN_PASSWORD
    type: secret
    generate: password(24)
    label: Admin password
  - key: PAPERLESS_SECRET_KEY
    type: secret
    generate: secret(64)
    label: Secret key
  - key: PAPERLESS_OCR_LANGUAGE
    type: string
    label: OCR language
    description: Tesseract language code(s), e.g. eng, deu or eng+fra.
    default: eng
