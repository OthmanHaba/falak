name: Ghost
slug: ghost
version: 1.0.0
description: Publishing platform for blogs, newsletters and paid memberships, with MySQL.
category: cms
icon: ghost
docs: https://ghost.org/docs/config/
stateful: true
min_memory_mb: 1024
popular: true
tags: [blog, newsletter, publishing]
public:
  - service: ghost
    port: 2368
inputs:
  - key: MYSQL_PASSWORD
    type: secret
    generate: password(32)
    label: MySQL password
  - key: MYSQL_ROOT_PASSWORD
    type: secret
    generate: password(32)
    label: MySQL root password
  - key: MAIL_FROM
    type: email
    label: Sender address
    description: From address of member and staff emails (configure SMTP later in the variables).
    required: false
