# Finish setup at <url>/ghost right after the first deploy (the first visitor creates the owner account).
services:
  ghost:
    image: ghost:6.65.0-alpine
    restart: unless-stopped
    expose: ["2368"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      url: ${{ falak.url(ghost) }}
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ghost
      mail__from: ${MAIL_FROM}
    volumes:
      - ghost-content:/var/lib/ghost/content
    healthcheck:
      # TCP check: HTTP requests are redirected to the https URL.
      test: ["CMD", "node", "-e", "require('net').connect(2368, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ghost-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  ghost-content:
  ghost-db:
