# Set a password right away under Settings → General → Password (the app is open until you do).
services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.8
    restart: unless-stopped
    expose: ["5000"]
    environment:
      BASE_URL: ${{ kiln.url(changedetection) }}
      TZ: ${TIMEZONE}
      HIDE_REFERER: "true"
    volumes:
      - changedetection-data:/datastore
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  changedetection-data:
