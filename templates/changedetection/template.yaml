name: changedetection.io
slug: changedetection
version: 1.0.0
description: Watch web pages for changes and get notified by email, Slack, Discord, ntfy and more.
category: monitoring
icon: changedetection
docs: https://github.com/dgtlmoon/changedetection.io/wiki
stateful: true
min_memory_mb: 256
tags: [website monitoring, alerts, price tracking]
public:
  - service: changedetection
    port: 5000
inputs:
  - key: TIMEZONE
    type: select
    label: Timezone
    options: [UTC, Europe/London, Europe/Berlin, Europe/Paris, America/New_York, America/Chicago, America/Los_Angeles, Asia/Tokyo, Asia/Singapore, Australia/Sydney]
    default: UTC
