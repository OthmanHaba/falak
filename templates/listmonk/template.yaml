name: listmonk
slug: listmonk
version: 1.0.0
description: High-performance newsletter and mailing list manager with PostgreSQL.
category: communication
icon: listmonk
docs: https://listmonk.app/docs/installation/
stateful: true
min_memory_mb: 256
tags: [newsletter, email, campaigns]
public:
  - service: listmonk
    port: 9000
inputs:
  - key: ADMIN_USER
    type: string
    label: Admin user
    default: admin
  - key: ADMIN_PASSWORD
    type: secret
    generate: password(24)
    label: Admin password
  - key: POSTGRES_PASSWORD
    type: secret
    generate: password(32)
    label: PostgreSQL password
  - key: TIMEZONE
    type: select
    label: Timezone
    options: [UTC, Europe/London, Europe/Berlin, Europe/Paris, America/New_York, America/Chicago, America/Los_Angeles, Asia/Tokyo, Asia/Singapore, Australia/Sydney]
    default: UTC
