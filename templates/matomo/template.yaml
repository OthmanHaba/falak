name: Matomo
slug: matomo
version: 1.0.0
description: Full-featured, privacy-respecting web analytics with heatmaps, goals and funnels.
category: analytics
icon: matomo
docs: https://matomo.org/docs/
stateful: true
min_memory_mb: 1024
tags: [web analytics, privacy, gdpr]
public:
  - service: matomo
    port: 80
inputs:
  - key: DB_PASSWORD
    type: secret
    generate: password(32)
    label: Database password
  - key: DB_ROOT_PASSWORD
    type: secret
    generate: password(32)
    label: Database root password
