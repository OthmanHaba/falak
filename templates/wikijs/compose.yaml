# Open the URL after the first deploy to create the admin account (the setup page is open until you do).
services:
  wiki:
    image: requarks/wiki:2.5.315
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: wiki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wiki-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  wiki-db:
