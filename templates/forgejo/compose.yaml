# Git over HTTPS only (SSH is disabled; the edge routes HTTP). The first registered user becomes the admin.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5
    restart: unless-stopped
    expose: ["3000"]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: ${{ falak.domain(forgejo) }}
      FORGEJO__server__ROOT_URL: ${{ falak.url(forgejo) }}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
      FORGEJO__service__DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  forgejo-data:
