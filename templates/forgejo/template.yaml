name: Forgejo
slug: forgejo
version: 1.0.0
description: Community-run Git forge with pull requests, issues, packages and Actions (a Gitea fork).
category: dev-tools
icon: forgejo
docs: https://forgejo.org/docs/latest/admin/installation-docker/
stateful: true
min_memory_mb: 512
tags: [git, code review, ci]
public:
  - service: forgejo
    port: 3000
inputs:
  - key: FORGEJO_SECRET_KEY
    type: secret
    generate: secret(64)
    label: Secret key
  - key: FORGEJO_INTERNAL_TOKEN
    type: secret
    generate: secret(105)
    label: Internal token
  - key: DISABLE_REGISTRATION
    type: boolean
    label: Disable registration
    description: Leave off until you have created your own account.
    default: false
