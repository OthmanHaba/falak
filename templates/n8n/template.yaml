name: n8n
slug: n8n
version: 1.0.0
description: Workflow automation with 400+ integrations, code when you need it and AI agents.
category: automation
icon: n8n
docs: https://docs.n8n.io/hosting/
stateful: true
min_memory_mb: 512
popular: true
tags: [workflows, integrations, ai]
public:
  - service: n8n
    port: 5678
inputs:
  - key: N8N_ENCRYPTION_KEY
    type: secret
    generate: secret(32)
    label: Encryption key
    description: Encrypts stored credentials. Keep it — credentials cannot be decrypted without it.
  - key: TIMEZONE
    type: select
    label: Timezone
    description: Used by schedule triggers.
    options: [UTC, Europe/London, Europe/Berlin, Europe/Paris, America/New_York, America/Chicago, America/Los_Angeles, Asia/Tokyo, Asia/Singapore, Australia/Sydney]
    default: UTC
