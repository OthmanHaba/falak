# All-in-one image (MongoDB, Redis and the app server run inside). Open the site after the first deploy to
# create the admin account.
services:
  appsmith:
    image: appsmith/appsmith-ce:v2.4.2
    restart: unless-stopped
    expose: ["80"]
    environment:
      APPSMITH_ENCRYPTION_PASSWORD: ${APPSMITH_ENCRYPTION_PASSWORD}
      APPSMITH_ENCRYPTION_SALT: ${APPSMITH_ENCRYPTION_SALT}
      APPSMITH_DISABLE_TELEMETRY: "true"
      APPSMITH_BASE_URL: ${{ kiln.url(appsmith) }}
    volumes:
      - appsmith-stacks:/appsmith-stacks
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  appsmith-stacks:
