name: Appsmith
slug: appsmith
version: 1.0.0
description: Low-code platform for internal tools, admin panels and dashboards (Community Edition).
category: dev-tools
icon: appsmith
docs: https://docs.appsmith.com/getting-started/setup/installation-guides/docker
stateful: true
min_memory_mb: 4096
tags: [low-code, internal tools]
public:
  - service: appsmith
    port: 80
inputs:
  - key: APPSMITH_ENCRYPTION_PASSWORD
    type: secret
    generate: secret(32)
    label: Encryption password
  - key: APPSMITH_ENCRYPTION_SALT
    type: secret
    generate: secret(32)
    label: Encryption salt
