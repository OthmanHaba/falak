# Drawings stay in each browser (local storage) or in exported files; the server only serves the app.
services:
  excalidraw:
    # Upstream publishes no version tags for multi-arch images: pinned by digest.
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    restart: unless-stopped
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
