# Release: push a tag vX.Y.Z (vX.Y.Z-rc.N = pre-release, not tagged `latest`).
#   1. multi-arch images (native amd64 + arm64 runners, merged manifests) -> GHCR:
#        ghcr.io/<owner>/falak-control-plane, falak-builder, falak-edge, falak-fn-bun, falak-fn-node,
#        falak-fn-deno, falak-fn-python, falak-fn-go  :<tag> and :latest
#   2. falak-agent / falak / falak-builder binaries (make build), falak-deploy.tar.gz, install.sh, falak-ctl,
#      SHA256SUMS -> GitHub release assets.
# Only GITHUB_TOKEN is used. After the first release, make the GHCR packages public
# (Package settings -> Change visibility) so servers can pull without logging in.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The database images the control plane ships (docs/DB_IMAGES.md, "Trust"): the db-images run of this same tag
  # publishes <version>-<tag> for every engine/version; this job waits for all of them (up to 2 h: it builds, tests and
  # scans first) and pins their index digests into the control-plane image. A missing image fails the release.
  db-digests:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the database image digests of this tag
        run: tools/db-image-digests.sh "-${GITHUB_REF_NAME}" --wait 7200 --owner "${GITHUB_REPOSITORY_OWNER}"
      - uses: actions/upload-artifact@v4
        with:
          name: db-image-digests
          path: control-plane/modules/Databases/config/db-image-digests.json
          if-no-files-found: error
          retention-days: 1

  images:
    name: image ${{ matrix.image }} (${{ matrix.arch }})
    needs: db-digests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [control-plane, builder, edge, fn-bun, fn-node, fn-deno, fn-python, fn-go]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: control-plane
            dockerfile: control-plane/Dockerfile
            context: .
          - image: builder
            dockerfile: deploy/builder.Dockerfile
            context: .
          - image: edge
            dockerfile: deploy/edge/Dockerfile
            context: deploy/edge
          # Function runtimes (runtimes/functions/<runtime>/README.md); servers pull them for functions. The context
          # is runtimes/functions: the JS runtimes share shared/ (tracer, entry loader, scheduled runs).
          - image: fn-bun
            dockerfile: runtimes/functions/bun/Dockerfile
            context: runtimes/functions
          - image: fn-node
            dockerfile: runtimes/functions/node/Dockerfile
            context: runtimes/functions
          - image: fn-deno
            dockerfile: runtimes/functions/deno/Dockerfile
            context: runtimes/functions
          - image: fn-python
            dockerfile: runtimes/functions/python/Dockerfile
            context: runtimes/functions
          - image: fn-go
            dockerfile: runtimes/functions/go/Dockerfile
            context: runtimes/functions
    steps:
      - uses: actions/checkout@v4

      - name: Pinned database images
        if: matrix.image == 'control-plane'
        uses: actions/download-artifact@v4
        with:
          name: db-image-digests
          path: control-plane/modules/Databases/config

      - name: Check the pinned database images
        if: matrix.image == 'control-plane'
        run: jq -e '[.[] | .[]] | length > 0 and all(test("^sha256:[0-9a-f]{64}$"))' control-plane/modules/Databases/config/db-image-digests.json

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/falak-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: FALAK_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: manifest ${{ matrix.image }}
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [control-plane, builder, edge, fn-bun, fn-node, fn-deno, fn-python, fn-go]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (<tag>, and latest for final releases)
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/falak-${{ matrix.image }}"
          tags=(-t "$image:${GITHUB_REF_NAME}")
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:${GITHUB_REF_NAME}"

  release:
    name: GitHub release
    needs: manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build binaries
        working-directory: agent
        run: make build VERSION="${GITHUB_REF_NAME}"

      - name: Assemble assets
        run: deploy/tools/release-assets.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Falak $GITHUB_REF_NAME" "${prerelease[@]}"
