# Kiln — production stack (single host). Installed by deploy/install.sh into /opt/kiln and driven by
# kiln-ctl; mirrors the topology proven in sim/compose.yml.
#
#   docker compose -p kiln --env-file /opt/kiln/.env -f /opt/kiln/deploy/compose.yml [--profile observability] up -d
#
#   internet ──:80/:443──► edge (Caddy: ACME TLS, agent mTLS, security headers)
#                           ├─ KILN_DOMAIN           ─► control-plane :8080 (panel: FrankenPHP worker mode)
#                           │                        ├► agent-api :8080 (/agent/*, /install/*, /api/internal/*)
#                           │                        ├► reverb :8080 (/app, /apps)
#                           │                        └► gateway :4318 (/otlp/*, observability profile)
#                           ├─ KILN_AGENT_API_HOST   ─► agent-api (Fleet-CA server cert, client certs verified)
#                           └─ KILN_GRAFANA_HOST     ─► grafana :3000 (observability profile)
#   control-plane · agent-api · horizon · reverb · scheduler ── backend ──► postgres · valkey
#   builder ── public ──► edge (as KILN_DOMAIN; artifact upload/download over the panel URL)
#
# Panel vs agent-api: same image, separate FrankenPHP thread pools. Every agent (and builder) keeps a 30 s
# long-poll open, i.e. one busy PHP thread each; on the panel's pool they would queue every user request
# behind them. PHP threads: KILN_WORKER_MODE / KILN_PHP_WORKERS / KILN_PHP_MAX_THREADS (panel) and
# KILN_AGENT_API_THREADS (agent-api, >= servers + builders + 8); see docs/INSTALL.md "Performance".
#
# Networks: `edge` has a fixed subnet (KILN_EDGE_SUBNET) because it is the only place the edge talks to the
# app from, and the app trusts X-Forwarded-* / the client-cert fingerprint header only from that subnet.
#
# Memory limits are caps, not reservations; the measured idle budget per service is in docs/INSTALL.md
# ("Resource budget"). Core stack ≈ 0.6-0.8 GB idle (limits ≈ 4.3 GB), observability profile ≈ +0.6 GB.
#
# Secrets live only in /opt/kiln/.env (generated by install.sh, mode 600). Anything else Laravel reads
# (MAIL_*, KILN_* tuning) can go in /opt/kiln/custom.env.

name: kiln

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-control-plane: &control-plane
  image: ${KILN_IMAGE_PREFIX:?set KILN_IMAGE_PREFIX}/kiln-control-plane:${KILN_VERSION:?set KILN_VERSION}
  logging: *logging
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: ../custom.env
      required: false
  environment: &cp-env
    APP_NAME: Kiln
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?set APP_KEY}
    APP_URL: ${KILN_URL:?set KILN_URL}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${KILN_LOG_LEVEL:-warning}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: kiln
    DB_USERNAME: kiln
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    REDIS_CLIENT: phpredis
    REDIS_HOST: valkey
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:?set REVERB_APP_ID}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET}
    # Server-side publishing goes straight to reverb; browsers connect to wss://KILN_DOMAIN/app (edge).
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_PORT: "8080"
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-kiln@localhost}
    MAIL_FROM_NAME: Kiln
    # Fleet / agents
    KILN_PANEL_URL: ${KILN_URL}
    KILN_AGENT_API_URL: ${KILN_AGENT_API_URL:?set KILN_AGENT_API_URL}
    KILN_EDGE_AGENT_API_HOST: ${KILN_AGENT_API_HOST:?set KILN_AGENT_API_HOST}
    KILN_AGENT_API_HOST_ALIASES: ${KILN_AGENT_API_HOST_ALIASES:-}
    KILN_CA_PATH: /kiln/ca
    KILN_AGENT_TRUSTED_PROXIES: ${KILN_EDGE_SUBNET:-10.213.77.0/24}
    TRUSTED_PROXIES: ${KILN_EDGE_SUBNET:-10.213.77.0/24}
    KILN_AGENT_WAKE_DRIVER: redis
    KILN_ACME_EMAIL: ${KILN_ACME_EMAIL:-}
    KILN_TEST_DOMAIN: ${KILN_TEST_DOMAIN:-}
    KILN_TEST_DOMAIN_TLS: ${KILN_TEST_DOMAIN_TLS:-acme}
    KILN_GENERATED_DOMAIN_SUFFIX: ${KILN_GENERATED_DOMAIN_SUFFIX:-sslip.io}
    KILN_DNS_RESOLVER: ${KILN_DNS_RESOLVER:-doh}
    KILN_DNS_DOH_URL: ${KILN_DNS_DOH_URL:-https://cloudflare-dns.com/dns-query}
    # Functions: runtime images are released with Kiln under the same prefix (kiln-fn-bun:<version>).
    KILN_IMAGE_PREFIX: ${KILN_IMAGE_PREFIX}
    # Builds: the builder container below polls with this token.
    KILN_LOCAL_BUILDER_TOKEN: ${KILN_BUILDER_TOKEN:?set KILN_BUILDER_TOKEN}
    KILN_HORIZON_MAX_PROCESSES: ${KILN_HORIZON_MAX_PROCESSES:-4}
    # PHP thread pools (deploy/control-plane/entrypoint.sh; empty = sized from the CPU count).
    KILN_WORKER_MODE: ${KILN_WORKER_MODE:-1}
    KILN_PHP_WORKERS: ${KILN_PHP_WORKERS:-}
    KILN_PHP_THREADS: ${KILN_PHP_THREADS:-}
    KILN_PHP_MAX_THREADS: ${KILN_PHP_MAX_THREADS:-}
    KILN_AGENT_API_THREADS: ${KILN_AGENT_API_THREADS:-128}
    # Telemetry (observability profile; empty values = not configured)
    KILN_OTLP_ENDPOINT: ${KILN_OTLP_ENDPOINT:-}
    KILN_OTLP_TOKEN: ${KILN_OTLP_TOKEN:-}
    KILN_GRAFANA_URL: ${KILN_GRAFANA_URL:-}
    KILN_GRAFANA_PUBLIC_URL: ${KILN_GRAFANA_PUBLIC_URL:-}
    KILN_GRAFANA_TOKEN: ${KILN_GRAFANA_TOKEN:-}
    KILN_LOKI_URL: ${KILN_LOKI_URL:-}
    KILN_TEMPO_URL: ${KILN_TEMPO_URL:-}
    KILN_METRICS_QUERY_URL: ${KILN_METRICS_QUERY_URL:-}
  volumes:
    - kiln-ca:/kiln/ca
    - app-storage:/app/storage

services:
  postgres:
    image: postgres:17.11
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiln
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=2000
    shm_size: 256m
    stop_grace_period: 60s
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512m }

  valkey:
    image: valkey/valkey:9.1.2-alpine
    logging: *logging
    restart: unless-stopped
    # Queues + cache + sessions: AOF (fsync every second) plus RDB snapshots; never evict (queued jobs).
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --appendfsync everysec --save 900 1 --save 300 100 --maxmemory 128mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 192m }

  control-plane:
    <<: *control-plane
    command: ["web"]
    environment:
      <<: *cp-env
      KILN_MIGRATE: "1"
    networks: [edge, backend, observability]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "kiln-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  # Agents, installer and builders (edge routes /agent/*, /install/*, /api/internal/* here): classic PHP
  # mode, thread pool autoscaled up to KILN_AGENT_API_THREADS (~2-3 MB per waiting long-poll).
  agent-api:
    <<: *control-plane
    command: ["agent-api"]
    networks: [edge, backend, observability]
    depends_on:
      control-plane: { condition: service_healthy }   # migrations have run
    healthcheck:
      test: ["CMD", "kiln-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  horizon:
    <<: *control-plane
    command: ["horizon"]
    stop_grace_period: 90s
    networks: [backend, observability]
    depends_on:
      control-plane: { condition: service_healthy }   # migrations have run
    healthcheck:
      test: ["CMD", "kiln-healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  reverb:
    <<: *control-plane
    command: ["reverb"]
    networks: [edge, backend]
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "kiln-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 192m }

  scheduler:
    <<: *control-plane
    command: ["scheduler"]
    networks: [backend, observability]
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "kiln-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256m }

  edge:
    image: ${KILN_IMAGE_PREFIX}/kiln-edge:${KILN_VERSION}
    logging: *logging
    restart: unless-stopped
    init: true
    environment:
      KILN_DOMAIN: ${KILN_DOMAIN:?set KILN_DOMAIN}
      KILN_AGENT_API_HOST: ${KILN_AGENT_API_HOST}
      KILN_AGENT_API_HOST_ALIASES: ${KILN_AGENT_API_HOST_ALIASES:-}
      KILN_DOMAIN_ALIASES: ${KILN_DOMAIN_ALIASES:-}
      KILN_URL: ${KILN_URL}
      KILN_GRAFANA_HOST: ${KILN_GRAFANA_HOST:-}
      KILN_TLS: ${KILN_TLS:-acme}
      KILN_ACME_EMAIL: ${KILN_ACME_EMAIL:-}
      KILN_ACME_CA: ${KILN_ACME_CA:-}
      KILN_HSTS: ${KILN_HSTS:-max-age=31536000}
      KILN_HTTP_PORT: ${KILN_HTTP_PORT:-80}
      KILN_HTTPS_PORT: ${KILN_HTTPS_PORT:-443}
      KILN_EDGE_CA_FILE: /kiln/ca/ca.pem
      KILN_EDGE_PKI_OUT: /kiln/edge-pki
    volumes:
      - kiln-ca:/kiln/ca:ro
      - edge-pki:/kiln/edge-pki
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Same port inside and out, so containers reach the edge at the public URL (see KILN_URL).
      - "${KILN_BIND:-0.0.0.0}:${KILN_HTTP_PORT:-80}:${KILN_HTTP_PORT:-80}"
      - "${KILN_BIND:-0.0.0.0}:${KILN_HTTPS_PORT:-443}:${KILN_HTTPS_PORT:-443}"
      - "${KILN_BIND:-0.0.0.0}:${KILN_HTTPS_PORT:-443}:${KILN_HTTPS_PORT:-443}/udp"
    networks:
      edge: {}
      observability: {}
      public:
        # The builder (and anything else on `public`) reaches the panel/agents hosts without hairpin NAT.
        aliases: ["${KILN_DOMAIN}", "${KILN_AGENT_API_HOST}"]
    depends_on:
      control-plane: { condition: service_started }
      agent-api: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 128m }

  # Shared builder of the control-plane host (native builds: PHP/Composer, Node, Bun).
  builder:
    image: ${KILN_IMAGE_PREFIX}/kiln-builder:${KILN_VERSION}
    logging: *logging
    restart: unless-stopped
    init: true
    command: ["serve"]
    environment:
      KILN_URL: ${KILN_URL}
      KILN_BUILDER_TOKEN: ${KILN_BUILDER_TOKEN}
      KILN_BUILDER_NAME: control-plane
      KILN_TLS: ${KILN_TLS:-acme}
    volumes:
      - builder-data:/var/lib/kiln-builder
      - builder-cache:/root/.cache
      - edge-pki:/kiln/edge-pki:ro
    networks: [public]
    depends_on:
      edge: { condition: service_healthy }
      agent-api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1536m }

  # --- observability profile (configs from ../observability; VictoriaMetrics backend) ------------------
  gateway:
    image: caddy:2.11.4-alpine
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    volumes:
      - ../observability/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      KILN_OTLP_TOKEN: ${KILN_OTLP_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4318/ready/logs && wget -q -O /dev/null http://127.0.0.1:4318/ready/traces && wget -q -O /dev/null http://127.0.0.1:4318/ready/metrics"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 64m }

  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      KILN_LOGS_RETENTION: ${KILN_LOGS_RETENTION:-360h}
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 384m }

  tempo:
    image: grafana/tempo:2.10.8
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      KILN_TRACES_RETENTION: ${KILN_TRACES_RETENTION:-360h}
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 384m }

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${KILN_METRICS_RETENTION:-30d}
      - -httpListenAddr=:8428
      - -opentelemetry.usePrometheusNaming=true
      - -memory.allowedPercent=60
      - -search.latencyOffset=5s
      - -loggerLevel=WARN
    volumes:
      - vm-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 384m }

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${KILN_GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_LOG_LEVEL: warn
      # Grafana 12+ downloads its Drilldown/Advisor/Pyroscope apps on first start (+~110 MB RAM, internet
      # access); Kiln's dashboards and alert rules do not use them. KILN_GRAFANA_PREINSTALL_DISABLED=false
      # restores the stock behaviour. Plugins already in the grafana-data volume keep loading.
      GF_PLUGINS_PREINSTALL_DISABLED: ${KILN_GRAFANA_PREINSTALL_DISABLED:-true}
      KILN_METRICS_QUERY_URL: http://gateway:9090/prometheus
      KILN_METRICS_PROMETHEUS_TYPE: Prometheus
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards/kiln:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      loki: { condition: service_started }
      tempo: { condition: service_started }
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 512m }

volumes:
  pg-data:
  valkey-data:
  app-storage:
  kiln-ca:
  edge-pki:
  caddy-data:
  caddy-config:
  builder-data:
  builder-cache:
  loki-data:
  tempo-data:
  vm-data:
  grafana-data:

networks:
  edge:
    ipam:
      config: [{ subnet: "${KILN_EDGE_SUBNET:-10.213.77.0/24}" }]
  backend: {}
  public: {}
  observability: {}
