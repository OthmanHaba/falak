; Appended to php.ini-production to form $PHP_INI_DIR/php-cli.ini, which the CLI SAPI reads instead of php.ini
; (FrankenPHP keeps using php.ini; conf.d/zz-kiln.ini applies to both).
;
; Horizon, Reverb, the scheduler (a `schedule:run` process every minute) and healthchecks (`horizon:status`)
; are CLI processes. Without OPcache every one of them compiles the whole app on start; with a file cache
; they load compiled scripts from disk (measured: artisan boot 86 ms -> 40 ms). file_cache_only: no
; per-process shared memory segment, so long-running workers use no more RAM than without OPcache.
; The cache lives in the container's /tmp and the entrypoint empties it on start. Timestamps are validated
; (one stat per file): bootstrap/cache/*.php and compiled views are rewritten at container start.
opcache.enable_cli = 1
opcache.file_cache = /tmp/kiln-opcache
opcache.file_cache_only = 1
opcache.file_cache_consistency_checks = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
