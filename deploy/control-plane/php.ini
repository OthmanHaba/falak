; Kiln control plane — production PHP settings for every SAPI (conf.d/zz-kiln.ini, layered over php.ini).
; SAPI-specific OPcache settings: php-server.ini (FrankenPHP) and php-cli.ini (artisan, Horizon, Reverb).
memory_limit = 256M
expose_php = Off
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 64M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.fast_shutdown = 1
