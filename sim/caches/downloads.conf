# Sim download cache: a caching reverse proxy for the release binaries servers fetch while provisioning
# (FrankenPHP / Bun / Deno from GitHub releases, Node.js from nodejs.org). The control plane points the
# agents at it through the product's runtime mirror settings (KILN_*_MIRROR, see compose.yml), served over
# HTTPS by the sim edge as https://downloads.kiln.test/{github,nodejs}/…  Agents still verify sha256.
proxy_cache_path /var/cache/nginx/downloads levels=1:2 keys_zone=downloads:10m max_size=10g inactive=365d use_temp_path=off;
resolver 127.0.0.11 ipv6=off valid=60s;

server {
    listen 80 default_server;

    proxy_cache downloads;
    proxy_cache_key $request_uri;
    proxy_cache_valid 200 365d;
    proxy_cache_lock on;                 # concurrent requests for one file: a single upstream fetch
    proxy_cache_lock_timeout 30m;
    proxy_cache_lock_age 30m;
    proxy_read_timeout 30m;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_intercept_errors on;
    recursive_error_pages on;
    proxy_set_header Accept-Encoding "";
    proxy_buffer_size 64k;               # GitHub's redirect responses carry large headers
    proxy_buffers 16 64k;
    add_header X-Kiln-Sim-Cache $upstream_cache_status always;

    location /github/ {
        proxy_pass https://github.com/;
        error_page 301 302 303 307 308 = @redirect;
    }

    location /nodejs/ {
        proxy_pass https://nodejs.org/dist/;
        error_page 301 302 303 307 308 = @redirect;
    }

    # GitHub release assets redirect to a signed CDN URL: follow it here and cache the final 200 under the
    # original request URI.
    location @redirect {
        set $location $upstream_http_location;
        proxy_pass $location;
        error_page 301 302 303 307 308 = @redirect;
    }

    location = /healthz {
        access_log off;
        proxy_cache off;
        return 200 "ok\n";
    }
}

# ondrej/php PPA (HTTPS, so apt's HTTP proxy cannot cache it): the servers resolve ppa.launchpadcontent.net to
# the sim edge, which terminates TLS and proxies here with the original Host. Packages are immutable (cached
# for a year); index files (dists/) are revalidated every few minutes, stale copies serve if upstream fails.
server {
    listen 80;
    server_name ppa.launchpadcontent.net;

    proxy_cache downloads;
    proxy_cache_key $host$request_uri;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30m;
    proxy_read_timeout 30m;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host ppa.launchpadcontent.net;
    proxy_set_header Accept-Encoding "";
    add_header X-Kiln-Sim-Cache $upstream_cache_status always;

    location / {
        proxy_cache_valid 200 365d;
        proxy_pass https://ppa.launchpadcontent.net;
    }

    location ~ /dists/ {
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_pass https://ppa.launchpadcontent.net;
    }
}
