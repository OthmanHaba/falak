# Loki 3.x monolithic (single binary), filesystem storage, TSDB index.
# OTLP logs are ingested natively at /otlp/v1/logs (routed from gateway :4318/v1/logs).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_recv_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_target_size: 1572864

limits_config:
  retention_period: ${KILN_LOGS_RETENTION:-360h}
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Resource attributes promoted to index labels (in addition to Loki's defaults such as
  # service_name, deployment_environment_name). Everything else lands in structured
  # metadata (queryable as `| attr="value"`), including trace_id / span_id.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - host.name
            - kiln.org.id
            - kiln.server.id
            - kiln.site.id

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

frontend:
  max_outstanding_per_tenant: 512

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
