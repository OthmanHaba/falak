# Tempo 2.x monolithic, local block storage, span-metrics generator.
# Span metrics are remote-written through the gateway (:9090/api/v1/write), which routes to
# the active metrics backend (VictoriaMetrics or Mimir).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: ${FALAK_TRACES_RETENTION:-360h}

metrics_generator:
  registry:
    collection_interval: 15s
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://gateway:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    span_metrics:
      # Labels become falak_event_type, http_route, falak_site_id, ... (dots -> underscores).
      # Resource attributes are looked up too, so falak.site.id set by the agent works.
      # Keep this list low-cardinality: never add ids that are unique per request or raw SQL.
      dimensions:
        - falak.event.type
        - falak.site.id
        - falak.server.id
        - http.route
        - http.request.method
        - http.response.status_code
        - messaging.destination.name
        - falak.job.class
        - falak.job.status
        - falak.cache.op
        - falak.cache.store
        - falak.mail.class
        - falak.notification.class
        - falak.notification.channel
        - falak.notification.status
        - falak.command.name
        - falak.schedule.name
        - falak.schedule.status
        - db.system.name
        - server.address
      histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics]

usage_report:
  reporting_enabled: false
